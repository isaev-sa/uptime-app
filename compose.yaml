services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: uptime
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uptime_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://uptime:${POSTGRES_PASSWORD:-uptime_local}@db:5432/uptime?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a secret of at least 32 bytes}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      UPLOAD_DIR: /uploads/files
      AVATAR_DIR: /uploads/avatars
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ACCESS_TTL: ${ACCESS_TTL:-15m}
      REFRESH_TTL: ${REFRESH_TTL:-720h}
    volumes:
      - avatar_data:/uploads
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: ./backend
    entrypoint: ["/worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://uptime:${POSTGRES_PASSWORD:-uptime_local}@db:5432/uptime?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  avatar_data:
